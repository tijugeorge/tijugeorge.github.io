<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  {% if page.favicon %}
    <link rel="icon" href="{{ page.favicon | relative_url }}">
  {% else %}
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}">
  {% endif %}
</head>
<body>

  <!-- Global Header / Navigation -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="{{ "/" | relative_url }}" class="logo-name">Tiju George<span class="dot">.</span></a>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#contributions">Contributions</a>
        <a href="#projects">Projects</a>
        <a href="#writing">Insights</a>
        <a href="https://github.com/tijugeorge" target="_blank" class="btn-primary">GitHub</a>
      </div>
    </div>
  </nav>

  <!-- Page Body Content -->
  <main>
    {{ content }}
  </main>

  <!-- Global Footer -->
  <footer id="contact" class="footer">
    <div class="container footer-content">
      <p>© {{ "now" | date: "%Y" }} Tiju George. Hosted on GitHub Pages.</p>
      <div class="footer-links">
        <a href="https://github.com/tijugeorge" target="_blank">GitHub</a>
        {% if site.email %}<a href="mailto:{{ site.email }}">Contact</a>{% endif %}
      </div>
    </div>
  </footer>

</body>
</html>
